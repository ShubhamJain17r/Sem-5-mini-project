# =====================================================================================
# Dual xArm 1s Color-Sorting Robot — Static Hardware & Kinematic Configuration
# File: config/dual_xarm_hardware.yaml
#
# PURPOSE:
#   Defines immutable physical and kinematic parameters for both robotic manipulators:
#   - Workspace mounting origins (X, Y, Z) and shared collinear axis (X = 360 mm)
#   - Physical link lengths (DH parameters)
#   - Joint travel limits (min_ticks, max_ticks)
#   - Rotation direction multipliers (+1 / -1) and semantic physical descriptions
#   - Multi-state waypoint poses (home_tucked, ready_standoff, drop_container)
#   - Dedicated drop box container targets (Box 1 NW, Box 2 SW)
#
# NOTE ON DEVIATIONS:
#   Volatile screw-tightening deviation offsets are decoupled and stored separately in:
#   config/servo_calibration.yaml.
#   Recalibrating deviations after tightening screws NEVER requires editing this file!
# =====================================================================================

version: "1.0"
date_created: "2026-09-16"

# -------------------------------------------------------------------------------------
# GLOBAL WORKCELL COORDINATE FRAME
# -------------------------------------------------------------------------------------
workspace:
  dimensions_mm:
    width_x: 560.0
    depth_y: 520.0
    board_thickness_mm: 18.0
  origin: "Front-Left baseboard corner (Operator at Y=0 looking toward +Y)"
  midline_x_mm: 280.0
  inter_arm_distance_x_mm: 220.0   # Baseline distance between xarm_1 (X=170) and xarm_2 (X=390)
  arm_baseplate_gap_mm: 80.0       # Gap between 140mm wide metal arm baseplates
  picking_arena:
    elevation_z_mm: 0.0            # Flat table / baseboard surface
    retaining_barrier: "8-10mm self-adhesive foam weatherstripping tape"
    silicone_friction_coeff: 0.8
    cube_size_mm: 25.0
    cube_center_z_mm: 12.5         # 0.0mm elevation + 12.5mm half-cube height
    min_x_mm: 80.0
    max_x_mm: 480.0
    min_y_mm: 40.0
    max_y_mm: 260.0

# -------------------------------------------------------------------------------------
# MANIPULATORS CONFIGURATION
# -------------------------------------------------------------------------------------
manipulators:

  # ===================================================================================
  # xArm 1: REAR / BACK MANIPULATOR
  # ===================================================================================
  xarm_1:
    name: "xArm 1 (Left / West Manipulator)"
    role: "Sorts objects in left arena quadrant (X <= 280 mm) into Left Flank Box 1"
    
    # Mounting position relative to global workspace origin
    base_mount_mm:
      x: 170.0
      y: 360.0
      z: 0.0
      nominal_heading_deg: -110.0  # 500 ticks points toward South-South-West (-110° world) into arena / flank bisector

    # Serial / USB Interface
    # Note: Ports may enumerate as either /dev/hidraw*, /dev/ttyUSB0, or /dev/ttyUSB1
    # depending on connection order. The driver supports auto-detection.
    communication:
      preferred_port: "auto"        # Auto-detects USB HID (0483:5750) or Serial
      fallback_serial_device: "/dev/ttyUSB0"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0       # Vertical offset to Motor 5 shoulder axis
      upper_arm_L1: 101.0             # Link between shoulder and elbow
      forearm_L2: 95.0                # Link between elbow and wrist pitch
      tool_claw_grip_center_L3: 150.0 # Link from wrist pitch to rubber pad grasp center
      tool_claw_fingertip_L3: 168.0   # Link from wrist pitch to claw outer fingertip
      tool_claw_L4: 150.0             # Backward compatibility alias

    # Dedicated Collection Box (Left Flank 2x2 Grid Sorting Tray) - 4 Color Compartments
    collection_box:
      id: 1
      name: "Box 1 (Left Flank 2x2 Tray)"
      center_world_mm:
        x: 50.0
        y: 360.0
        z: 0.0
      outer_dimensions_mm:
        width_x: 80.0
        depth_y: 80.0
        height_z: 35.0
      radial_reach_mm: 120.0
      azimuth_from_base_deg: -70.0  # ~-70° swing from nominal heading toward West flank
      base_yaw_drop_tick: 208       # Nominal center drop tick (120mm reach, -70° local yaw)
      grid_layout: "2x2"
      compartments:
        section_1_red:
          color: "red"
          grid_col: 1
          grid_row: 1
          offset_x_mm: -20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 30.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 175
        section_2_green:
          color: "green"
          grid_col: 2
          grid_row: 1
          offset_x_mm: 20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 70.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 161
        section_3_blue:
          color: "blue"
          grid_col: 1
          grid_row: 2
          offset_x_mm: -20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 30.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 242
        section_4_yellow:
          color: "yellow"
          grid_col: 2
          grid_row: 2
          offset_x_mm: 20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 70.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 255

    # Motor specifications, travel limits & physical inspection testing
    # Derived from empirical bench calibration (xArm PC App, tolerance ±5 ticks)
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 220
        max_tick: 800
        nominal_center_tick: 501
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Decreasing ticks opens claw (228 = 60mm); increasing ticks clamps/closes claw (791 = 0mm)"
        test_500_to_450_direction: "Fingers open wider toward 60mm limit"
        claw_span_mm:
          fully_open: {tick: 228, span_mm: 60.0}
          nominal_half_open: {tick: 501, span_mm: 40.0}
          grip_cube_25mm: {tick: 610, span_mm: 25.0}
          fully_closed_empty: {tick: 791, span_mm: 0.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 200
        max_tick: 800
        nominal_center_tick: 498
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 498 = level horizontal claw jaws
        motion_description: "Increasing ticks (>498) rolls counter-clockwise (ACW); decreasing ticks (<498) rolls clockwise (CW)"
        test_500_to_450_direction: "Rolls clockwise (CW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 110
        max_tick: 865
        nominal_center_tick: 497
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 497 = aligned collinearly with forearm
        motion_description: "0° (horizon forward) at 857 ticks; 180° (horizon backward) at 116 ticks; decreasing ticks tilts upward/backward"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 135
        max_tick: 870
        nominal_center_tick: 495
        direction_multiplier: 1
        zero_reference_angle_deg: 180.0 # 495 = 180 deg straight collinear extension with upper arm
        motion_description: "0° (folded forward) at 143 ticks; 180° (folded backward) at 864 ticks; increasing ticks folds backward"
        test_500_to_450_direction: "Folds forearm forward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 120
        max_tick: 870
        nominal_center_tick: 498
        direction_multiplier: 1        # Note: Inverted in URDF pitch, positive in servo ticks
        zero_reference_angle_deg: 90.0  # 498 = 90° upright vertical relative to table
        motion_description: "0° (forward horizontal) at 865 ticks; 180° (backward horizontal) at 125 ticks; decreasing ticks tilts upright/backward"
        test_500_to_450_direction: "Tilts upper arm BACKWARD/upright toward table surface"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
        min_tick: 100
        max_tick: 880
        nominal_center_tick: 495        # 495 ticks = nominal heading (-110° world)
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 0° = pointing along nominal heading
        motion_description: "90° ACW (CCW) at 875 ticks; 90° CW at 105 ticks; increasing ticks rotates CCW (toward arena/midline)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward Left Flank Box 1"

    # Predefined Multi-State Poses (Theoretical Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [500, 500, 500, 500, 500, 500]
        description: "Straight upright vertical reset pose; all servos at center (nominal 500 ticks)"
        transit_time_ms: 1500
      ready_standoff:
        ticks: [228, 500, 746, 155, 529, 495]
        description: "Hovering safely above left arena picking zone awaiting mutex (Zw ≈ 165mm)"
        transit_time_ms: 1600
      drop_container:
        ticks: [610, 500, 830, 160, 470, 208]
        description: "Hovering safely over Left Flank 2x2 tray (Z ≈ 56mm) ready to release object"
        transit_time_ms: 1800


  # ===================================================================================
  # xArm 2: FRONT / SOUTH MANIPULATOR
  # ===================================================================================
  xarm_2:
    name: "xArm 2 (Right / East Manipulator)"
    role: "Sorts objects in right arena quadrant (X > 280 mm) into Right Flank Box 2"

    # Mounting position relative to global workspace origin
    base_mount_mm:
      x: 390.0
      y: 360.0
      z: 0.0
      nominal_heading_deg: -70.0  # 500 ticks points toward South-South-East (-70° world) into arena / flank bisector

    # Serial / USB Interface
    communication:
      preferred_port: "auto"
      fallback_serial_device: "/dev/ttyUSB1"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0
      upper_arm_L1: 101.0
      forearm_L2: 95.0
      tool_claw_grip_center_L3: 150.0
      tool_claw_fingertip_L3: 168.0
      tool_claw_L4: 150.0

    # Dedicated Collection Box (Right Flank 2x2 Grid Sorting Tray) - 4 Color Compartments
    collection_box:
      id: 2
      name: "Box 2 (Right Flank 2x2 Tray)"
      center_world_mm:
        x: 510.0
        y: 360.0
        z: 0.0
      outer_dimensions_mm:
        width_x: 80.0
        depth_y: 80.0
        height_z: 35.0
      radial_reach_mm: 120.0
      azimuth_from_base_deg: 70.0   # ~+70° swing from nominal heading toward East flank
      base_yaw_drop_tick: 792       # Nominal center drop tick (120mm reach, +70° local yaw)
      grid_layout: "2x2"
      compartments:
        section_1_red:
          color: "red"
          grid_col: 1
          grid_row: 1
          offset_x_mm: -20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 490.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 839
        section_2_green:
          color: "green"
          grid_col: 2
          grid_row: 1
          offset_x_mm: 20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 530.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 825
        section_3_blue:
          color: "blue"
          grid_col: 1
          grid_row: 2
          offset_x_mm: -20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 490.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 745
        section_4_yellow:
          color: "yellow"
          grid_col: 2
          grid_row: 2
          offset_x_mm: 20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 530.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 758

    # Motor specifications, travel limits & physical inspection testing
    # Derived from empirical bench calibration (xArm PC App, tolerance ±5 ticks)
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 225
        max_tick: 785
        nominal_center_tick: 498
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Decreasing ticks opens claw (234 = 60mm); increasing ticks clamps/closes claw (776 = 0mm)"
        test_500_to_450_direction: "Fingers open wider toward 60mm limit"
        claw_span_mm:
          fully_open: {tick: 234, span_mm: 60.0}
          nominal_half_open: {tick: 498, span_mm: 40.0}
          grip_cube_25mm: {tick: 602, span_mm: 25.0}
          fully_closed_empty: {tick: 776, span_mm: 0.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 200
        max_tick: 800
        nominal_center_tick: 496
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Increasing ticks (>496) rolls counter-clockwise (ACW); decreasing ticks (<496) rolls clockwise (CW)"
        test_500_to_450_direction: "Rolls clockwise (CW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 125
        max_tick: 865
        nominal_center_tick: 493
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "0° (horizon forward) at 853 ticks; 180° (horizon backward) at 133 ticks; decreasing ticks tilts upward/backward"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 145
        max_tick: 875
        nominal_center_tick: 513
        direction_multiplier: 1
        zero_reference_angle_deg: 180.0
        motion_description: "0° (folded forward) at 158 ticks; 180° (folded backward) at 868 ticks; increasing ticks folds backward"
        test_500_to_450_direction: "Folds forearm forward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 135
        max_tick: 865
        nominal_center_tick: 497
        direction_multiplier: 1
        zero_reference_angle_deg: 90.0
        motion_description: "0° (forward horizontal) at 858 ticks; 180° (backward horizontal) at 141 ticks; decreasing ticks tilts upright/backward"
        test_500_to_450_direction: "Tilts upper arm BACKWARD/upright toward 180°"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
        min_tick: 125
        max_tick: 890
        nominal_center_tick: 502   # 502 ticks = nominal heading (-70° world)
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "90° ACW (CCW) at 881 ticks; 90° CW at 132 ticks; increasing ticks rotates CCW (toward Box 2)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward arena midline"

    # Predefined Multi-State Poses (Theoretical Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [500, 500, 500, 500, 500, 500]
        description: "Straight upright vertical reset pose; all servos at center (nominal 500 ticks)"
        transit_time_ms: 1500
      ready_standoff:
        ticks: [234, 500, 746, 155, 529, 502]
        description: "Hovering safely above right arena picking zone awaiting mutex (Zw ≈ 165mm, aligned M3/M4)"
        transit_time_ms: 1600
      drop_container:
        ticks: [602, 500, 830, 160, 470, 792]
        description: "Hovering safely over Right Flank 2x2 tray (Z ≈ 56mm) ready to release object (aligned M3/M4)"
        transit_time_ms: 1800
