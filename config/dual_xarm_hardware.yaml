        motion_description: "Increasing ticks rotates CCW (toward Box 2); decreasing rotates CW (toward arena/midline)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward arena midline"

    # Predefined Multi-State Poses (Theoretical Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [700, 500, 500, 280, 720, 500]
        description: "Compact low-inertia transit pose; claw open, elbow tucked high"
