        height_z: 35.0
      radial_reach_mm: 120.0
      azimuth_from_base_deg: 70.0   # ~+70° swing from nominal heading toward East flank
      base_yaw_drop_tick: 792       # Nominal center drop tick (120mm reach, +70° local yaw)
      grid_layout: "2x2"
      compartments:
        section_1_red:
          color: "red"
          grid_col: 1
          grid_row: 1
          offset_x_mm: -20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 490.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 839
        section_2_green:
          color: "green"
