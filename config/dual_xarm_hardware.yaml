          grid_row: 1
          offset_x_mm: 20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 530.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 825
        section_3_blue:
          color: "blue"
          grid_col: 1
          grid_row: 2
          offset_x_mm: -20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 490.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 745
        section_4_yellow:
          color: "yellow"
          grid_col: 2
          grid_row: 2
          offset_x_mm: 20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 530.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 758

    # Motor specifications, travel limits & physical inspection testing
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 150
        max_tick: 800
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Increasing ticks opens claw; decreasing ticks clamps"
        test_500_to_450_direction: "Fingers close / clamp inward toward cube"
        claw_span_mm:
          fully_closed_empty: {tick: 150, span_mm: 0.0}
          grip_cube_25mm: {tick: 250, span_mm: 25.0}
          nominal_half_open: {tick: 500, span_mm: 40.0}
          fully_open: {tick: 750, span_mm: 55.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 200
        max_tick: 800
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Increasing ticks rolls claw clockwise (facing end-effector)"
        test_500_to_450_direction: "Rolls counter-clockwise (CCW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 150
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Increasing ticks pitches wrist downward toward table"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 150
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 90.0
        motion_description: "Increasing ticks extends forearm forward; decreasing folds back"
        test_500_to_450_direction: "Folds forearm backward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 200
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 45.0
        motion_description: "Increasing ticks tilts shoulder backward/upright; decreasing tilts forward"
        test_500_to_450_direction: "Tilts upper arm FORWARD toward table surface"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
