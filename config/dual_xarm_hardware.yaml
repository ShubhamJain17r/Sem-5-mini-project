# =====================================================================================
# Dual xArm 1s Color-Sorting Robot — Static Hardware & Kinematic Configuration
# File: config/dual_xarm_hardware.yaml
#
# PURPOSE:
#   Defines immutable physical and kinematic parameters for both robotic manipulators:
#   - Workspace mounting origins (X, Y, Z) and shared collinear axis (X = 360 mm)
#   - Physical link lengths (DH parameters)
#   - Joint travel limits (min_ticks, max_ticks)
#   - Rotation direction multipliers (+1 / -1) and semantic physical descriptions
#   - Multi-state waypoint poses (home_tucked, ready_standoff, drop_container)
#   - Dedicated drop box container targets (Box 1 NW, Box 2 SW)
#
# NOTE ON DEVIATIONS:
#   Volatile screw-tightening deviation offsets are decoupled and stored separately in:
#   config/servo_calibration.yaml.
#   Recalibrating deviations after tightening screws NEVER requires editing this file!
# =====================================================================================

version: "1.0"
date_created: "2026-09-16"

# -------------------------------------------------------------------------------------
# GLOBAL WORKCELL COORDINATE FRAME
# -------------------------------------------------------------------------------------
workspace:
  dimensions_mm:
    width_x: 560.0
    depth_y: 520.0
    board_thickness_mm: 18.0
  origin: "Front-Left baseboard corner (Operator at Y=0 looking toward +Y)"
  midline_x_mm: 280.0
  inter_arm_distance_x_mm: 220.0   # Baseline distance between xarm_1 (X=170) and xarm_2 (X=390)
  arm_baseplate_gap_mm: 80.0       # Gap between 140mm wide metal arm baseplates
  picking_arena:
    elevation_z_mm: 0.0            # Flat table / baseboard surface
    retaining_barrier: "8-10mm self-adhesive foam weatherstripping tape"
    silicone_friction_coeff: 0.8
    cube_size_mm: 25.0
    cube_center_z_mm: 12.5         # 0.0mm elevation + 12.5mm half-cube height
    min_x_mm: 80.0
    max_x_mm: 480.0
    min_y_mm: 40.0
    max_y_mm: 260.0

# -------------------------------------------------------------------------------------
# MANIPULATORS CONFIGURATION
# -------------------------------------------------------------------------------------
manipulators:

  # ===================================================================================
  # xArm 1: REAR / BACK MANIPULATOR
  # ===================================================================================
  xarm_1:
    name: "xArm 1 (Left / West Manipulator)"
    role: "Sorts objects in left arena quadrant (X <= 280 mm) into Left Flank Box 1"
    
    # Mounting position relative to global workspace origin
    base_mount_mm:
      x: 170.0
      y: 360.0
      z: 0.0
      nominal_heading_deg: -110.0  # 500 ticks points toward South-South-West (-110° world) into arena / flank bisector

    # Serial / USB Interface
    # Note: Ports may enumerate as either /dev/hidraw*, /dev/ttyUSB0, or /dev/ttyUSB1
    # depending on connection order. The driver supports auto-detection.
    communication:
      preferred_port: "auto"        # Auto-detects USB HID (0483:5750) or Serial
      fallback_serial_device: "/dev/ttyUSB0"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0       # Vertical offset to Motor 5 shoulder axis
      upper_arm_L1: 101.0             # Link between shoulder and elbow
      forearm_L2: 95.0                # Link between elbow and wrist pitch
      tool_claw_grip_center_L3: 150.0 # Link from wrist pitch to rubber pad grasp center
      tool_claw_fingertip_L3: 168.0   # Link from wrist pitch to claw outer fingertip
      tool_claw_L4: 150.0             # Backward compatibility alias

    # Dedicated Collection Box (Left Flank 2x2 Grid Sorting Tray) - 4 Color Compartments
    collection_box:
      id: 1
      name: "Box 1 (Left Flank 2x2 Tray)"
      center_world_mm:
        x: 50.0
        y: 360.0
        z: 0.0
      outer_dimensions_mm:
        width_x: 80.0
        depth_y: 80.0
        height_z: 35.0
      radial_reach_mm: 120.0
      azimuth_from_base_deg: -70.0  # ~-70° swing from nominal heading toward West flank
      base_yaw_drop_tick: 208       # Nominal center drop tick (120mm reach, -70° local yaw)
      grid_layout: "2x2"
      compartments:
        section_1_red:
          color: "red"
          grid_col: 1
          grid_row: 1
          offset_x_mm: -20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 30.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 175
        section_2_green:
          color: "green"
          grid_col: 2
          grid_row: 1
          offset_x_mm: 20.0
          offset_y_mm: 20.0
          target_world_mm: {x: 70.0, y: 380.0, z: 35.0}
          drop_yaw_tick: 161
        section_3_blue:
          color: "blue"
          grid_col: 1
          grid_row: 2
          offset_x_mm: -20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 30.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 242
        section_4_yellow:
          color: "yellow"
          grid_col: 2
          grid_row: 2
          offset_x_mm: 20.0
          offset_y_mm: -20.0
          target_world_mm: {x: 70.0, y: 340.0, z: 35.0}
          drop_yaw_tick: 255

    # Motor specifications, travel limits & physical inspection testing
    # Use these fields to record your manual physical calibration test results:
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 150
        max_tick: 800
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Increasing ticks opens claw; decreasing ticks clamps"
        test_500_to_450_direction: "Fingers close / clamp inward toward cube"
        claw_span_mm:
          fully_closed_empty: {tick: 150, span_mm: 0.0}
          grip_cube_25mm: {tick: 250, span_mm: 25.0}
          nominal_half_open: {tick: 500, span_mm: 40.0}
          fully_open: {tick: 750, span_mm: 55.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 200
        max_tick: 800
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 500 = level horizontal claw jaws
        motion_description: "Increasing ticks rolls claw clockwise (facing end-effector)"
        test_500_to_450_direction: "Rolls counter-clockwise (CCW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 150
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 500 = aligned collinearly with forearm
        motion_description: "Increasing ticks pitches wrist downward toward table"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 150
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1
        zero_reference_angle_deg: 90.0  # 500 = 90 deg interior right-angle with upper arm
        motion_description: "Increasing ticks extends forearm forward; decreasing folds back"
        test_500_to_450_direction: "Folds forearm backward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 200
        max_tick: 850
        nominal_center_tick: 500
        direction_multiplier: 1        # Note: Inverted in URDF pitch, positive in servo ticks
        zero_reference_angle_deg: 45.0  # Theoretical: 500 = 45° forward above horizontal
        motion_description: "Increasing ticks tilts shoulder backward/upright; decreasing tilts forward"
        test_500_to_450_direction: "Tilts upper arm FORWARD toward table surface"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
        min_tick: 150
        max_tick: 850
        nominal_center_tick: 500        # 500 ticks = nominal heading (-110° world)
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 0° = pointing along nominal heading
        motion_description: "Increasing ticks rotates CCW (toward arena/midline); decreasing rotates CW (toward Box 1)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward Left Flank Box 1"

    # Predefined Multi-State Poses (Theoretical Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [700, 500, 500, 280, 720, 500]
        description: "Compact low-inertia transit pose; claw open, elbow tucked high"
        transit_time_ms: 1500
      ready_standoff:
        ticks: [700, 500, 466, 324, 750, 500]
        description: "Hovering 70mm above left arena picking zone awaiting mutex"
        transit_time_ms: 1600
      drop_container:
        ticks: [250, 500, 790, 415, 835, 208]
        description: "Lowered over Left Flank 2x2 tray ready to release object"
        transit_time_ms: 1800


  # ===================================================================================
  # xArm 2: FRONT / SOUTH MANIPULATOR
  # ===================================================================================
  xarm_2:
    name: "xArm 2 (Right / East Manipulator)"
    role: "Sorts objects in right arena quadrant (X > 280 mm) into Right Flank Box 2"

    # Mounting position relative to global workspace origin
    base_mount_mm:
      x: 390.0
      y: 360.0
      z: 0.0
      nominal_heading_deg: -70.0  # 500 ticks points toward South-South-East (-70° world) into arena / flank bisector

    # Serial / USB Interface
    communication:
      preferred_port: "auto"
      fallback_serial_device: "/dev/ttyUSB1"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0
      upper_arm_L1: 101.0
      forearm_L2: 95.0
      tool_claw_grip_center_L3: 150.0
      tool_claw_fingertip_L3: 168.0
      tool_claw_L4: 150.0

    # Dedicated Collection Box (Right Flank 2x2 Grid Sorting Tray) - 4 Color Compartments
    collection_box:
      id: 2
      name: "Box 2 (Right Flank 2x2 Tray)"
      center_world_mm:
        x: 510.0
