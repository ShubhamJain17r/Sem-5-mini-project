# =====================================================================================
# Dual xArm 1s Color-Sorting Robot — Volatile Calibrated Servo Deviations
# File: config/servo_calibration.yaml
#
# PURPOSE:
#   Stores measured mechanical spline/screw deviation trims (ticks) for each servo.
#   These values are added to theoretical angles before hardware packet transmission:
#     hardware_ticks = theoretical_ticks + deviation
#
# MAINTENANCE WORKFLOW (When screws are loosened or tightened):
#   1. Use the official xArm software/app to set horn splines closest to 500 ticks.
#   2. Flash 'arduino/xarm_zero_calibration/xarm_zero_calibration.ino'.
#   3. Select arm via 'arm 1' or 'arm 2' in Serial Monitor CLI.
#   4. Fine-trim joints to align visual chassis markers.
#   5. Type 'p' in CLI to export the calibrated YAML block below.
#
# IMPORTANT:
#   Static hardware specs, limits, directions, and box coordinates live in:
#   config/dual_xarm_hardware.yaml
# =====================================================================================

version: "1.0"
last_calibrated: "2026-09-16"

# -------------------------------------------------------------------------------------
# xArm 1: REAR / BACK MANIPULATOR (Phase 0 Measured)
# -------------------------------------------------------------------------------------
xarm_1:
  calibrated_date: "2026-09-16"
  status: "verified"
  servo_deviations:
    motor_1_claw: 1
    motor_2_wrist_roll: 3
    motor_3_wrist_pitch: -3
    motor_4_elbow: -13
    motor_5_shoulder: 0
    motor_6_base_yaw: 0

  # C++ / Arduino array representation (1-indexed, index 0 unused)
  # const int SERVO_DEV_ARM1[7] = {0, 1, 3, -3, -13, 0, 0};

