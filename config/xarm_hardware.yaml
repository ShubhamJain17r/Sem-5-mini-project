# =====================================================================================
# Single xArm 1S Color-Sorting Robot — Unified Hardware & Kinematic Configuration
# File: config/xarm_hardware.yaml
#
# PURPOSE:
#   Defines the complete, unified physical and kinematic parameters for the single
#   xArm 1S robotic manipulator:
#   - Workspace mounting origin (X, Y, Z), Z-depth trim, and nominal heading angle
#   - Physical link lengths (DH parameters)
#   - Joint travel limits (min_ticks, max_ticks) and nominal centers (from xArm PC App)
#   - Rotation direction multipliers (+1 / -1) and semantic physical descriptions
#   - Multi-state waypoint poses (home_tucked, ready_standoff, drop_container)
#   - Dedicated 2x2 quadrant sorting tray targets on Left Flank (Red, Green, Blue, Yellow)
#
# CALIBRATION:
#   Physical servo deviations are calibrated via the official Hiwonder xArm PC App,
#   which writes zero offsets directly into the servo onboard EEPROM registers.
# =====================================================================================

version: "2.0"
date_created: "2026-11-15"

# -------------------------------------------------------------------------------------
# GLOBAL WORKCELL COORDINATE FRAME
# -------------------------------------------------------------------------------------
workspace:
  dimensions_mm:
    width_x: 400.0
    depth_y: 400.0
    board_thickness_mm: 18.0
  origin: "Front-Left baseboard corner (Operator at Y=0 looking toward +Y)"
  midline_x_mm: 200.0
  picking_arena:
    elevation_z_mm: 0.0            # Flat table / baseboard surface
    retaining_barrier: "8-10mm self-adhesive foam weatherstripping tape"
    silicone_friction_coeff: 0.8
    cube_size_mm: 31.75            # 1.25 inch length and width
    cube_height_mm: 19.05          # 0.75 inch block thickness
    cube_center_z_mm: 9.53         # 0.0mm elevation + 9.53mm half-block height
    min_x_mm: 70.0
    max_x_mm: 330.0
    min_y_mm: 40.0
    max_y_mm: 180.0

# -------------------------------------------------------------------------------------
# MANIPULATOR CONFIGURATION (xarm_1)
# -------------------------------------------------------------------------------------
manipulators:
  max_deviation_ticks: 25        # Clamping guardrail against accidental excessive offsets

  xarm_1:
    name: "xArm 1S (Central Manipulator)"
    role: "Sorts objects from the active picking arena into the Left Flank open collection container"
    
    # Mounting position relative to global workspace origin
    base_mount_mm:
      x: 200.0
      y: 280.0
      z: 0.0
      z_depth_trim_mm: 0.0         # Dynamic Cartesian tabletop depth offset
      nominal_heading_deg: -90.0   # 500 ticks points directly South (-90° world, -Y) into picking arena

    # Serial / USB Interface
    communication:
      preferred_port: "auto"        # Auto-detects USB HID (0483:5750) or Serial
      fallback_serial_device: "/dev/ttyUSB0"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0       # Vertical offset to Motor 5 shoulder axis
      upper_arm_L1: 101.0             # Link between shoulder and elbow
      forearm_L2: 95.0                # Link between elbow and wrist pitch
      tool_claw_grip_center_L3: 150.0 # Link from wrist pitch to rubber pad grasp center
      tool_claw_fingertip_L3: 168.0   # Link from wrist pitch to claw outer fingertip
      tool_claw_L4: 150.0             # Backward compatibility alias

    # Dedicated Collection Box (Left Flank Open Sorting Container) - Single Large Bin
    collection_box:
      id: 1
      name: "Box 1 (Left Flank Single Container)"
      center_world_mm:
        x: 50.0
        y: 280.0
        z: 0.0
      outer_dimensions_mm:
        width_x: 100.0
        depth_y: 100.0
        height_z: 35.0
      radial_reach_mm: 150.0
      azimuth_from_base_deg: -90.0  # -90° swing (clockwise from South to West)
      base_yaw_drop_tick: 145       # Nominal center drop tick (150mm reach, -90° local yaw)
      grid_layout: "1x1"
      target_world_mm: {x: 50.0, y: 280.0, z: 40.0}
      compartments:
        section_1_red:
          color: "red"
          grid_col: 1
          grid_row: 1
          offset_x_mm: 0.0
          offset_y_mm: 0.0
          target_world_mm: {x: 50.0, y: 280.0, z: 40.0}
          drop_yaw_tick: 145
        section_2_green:
          color: "green"
          grid_col: 1
          grid_row: 1
          offset_x_mm: 0.0
          offset_y_mm: 0.0
          target_world_mm: {x: 50.0, y: 280.0, z: 40.0}
          drop_yaw_tick: 145
        section_3_blue:
          color: "blue"
          grid_col: 1
          grid_row: 1
          offset_x_mm: 0.0
          offset_y_mm: 0.0
          target_world_mm: {x: 50.0, y: 280.0, z: 40.0}
          drop_yaw_tick: 145
        section_4_yellow:
          color: "yellow"
          grid_col: 1
          grid_row: 1
          offset_x_mm: 0.0
          offset_y_mm: 0.0
          target_world_mm: {x: 50.0, y: 280.0, z: 40.0}
          drop_yaw_tick: 145

    # Motor specifications, travel limits & physical inspection testing
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 220
        max_tick: 800
        nominal_center_tick: 501
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Decreasing ticks opens claw (228 = 60mm); increasing ticks clamps/closes claw (791 = 0mm)"
        test_500_to_450_direction: "Fingers open wider toward 60mm limit"
        claw_span_mm:
          fully_open: {tick: 228, span_mm: 60.0}
          nominal_half_open: {tick: 501, span_mm: 40.0}
          grip_cube_25mm: {tick: 610, span_mm: 25.0}
          fully_closed_empty: {tick: 791, span_mm: 0.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 200
        max_tick: 800
        nominal_center_tick: 498
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 498 = level horizontal claw jaws
        motion_description: "Increasing ticks (>498) rolls counter-clockwise (ACW); decreasing ticks (<498) rolls clockwise (CW)"
        test_500_to_450_direction: "Rolls clockwise (CW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 110
        max_tick: 865
        nominal_center_tick: 497
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 497 = aligned collinearly with forearm
        motion_description: "0° (horizon forward) at 857 ticks; 180° (horizon backward) at 116 ticks; decreasing ticks tilts upward/backward"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 135
        max_tick: 870
        nominal_center_tick: 495
        direction_multiplier: 1
        zero_reference_angle_deg: 180.0 # 495 = 180 deg straight collinear extension with upper arm
        motion_description: "0° (folded forward) at 143 ticks; 180° (folded backward) at 864 ticks; increasing ticks folds backward"
        test_500_to_450_direction: "Folds forearm forward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 120
        max_tick: 870
        nominal_center_tick: 498
        direction_multiplier: 1        # Note: Inverted in URDF pitch, positive in servo ticks
        zero_reference_angle_deg: 90.0  # 498 = 90° upright vertical relative to table
        motion_description: "0° (forward horizontal) at 865 ticks; 180° (backward horizontal) at 125 ticks; decreasing ticks tilts upright/backward"
        test_500_to_450_direction: "Tilts upper arm BACKWARD/upright toward table surface"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
        min_tick: 100
        max_tick: 880
        nominal_center_tick: 495        # 495 ticks = nominal heading (-90° world / South)
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 0° = pointing along nominal heading
        motion_description: "90° ACW (CCW) at 875 ticks; 90° CW at 105 ticks; increasing ticks rotates CCW (toward East); decreasing rotates CW (toward Left Flank West)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward Left Flank Box 1"

    # Predefined Multi-State Poses (Theoretical Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [500, 500, 500, 500, 500, 500]
        description: "Straight upright vertical reset pose; all servos at center (nominal 500 ticks)"
        transit_time_ms: 1500
      ready_standoff:
        ticks: [228, 500, 746, 155, 529, 495]
        description: "Hovering safely above arena picking zone awaiting commands (Zw ≈ 165mm)"
        transit_time_ms: 1600
      drop_container:
        ticks: [610, 500, 830, 160, 470, 145]
        description: "Hovering safely over Left Flank 2x2 tray (Z ≈ 56mm) ready to release object"
        transit_time_ms: 1800
