# =====================================================================================
# Single xArm 1S Dual-Color (Red & Green) Sorting Robot — Unified Hardware & Kinematic Configuration
# File: config/xarm_hardware.yaml
#
# PURPOSE:
#   Defines the complete, unified physical and kinematic parameters for the single
#   xArm 1S robotic manipulator:
#   - Workspace mounting origin (X, Y, Z), Z-depth trim, and nominal heading angle
#   - Physical link lengths (DH parameters)
#   - Joint travel limits (min_ticks, max_ticks) and nominal centers (from xArm PC App)
#   - Rotation direction multipliers (+1 / -1) and semantic physical descriptions
#   - Multi-state waypoint poses (home_tucked, ready_standoff, drop_container)
#   - Dedicated dual container box targets on Rear Flank (Red and Green objects)
#
# CALIBRATION:
#   Physical servo deviations are calibrated via the official Hiwonder xArm PC App,
#   which writes zero offsets directly into the servo onboard EEPROM registers.
# =====================================================================================

version: "2.0"
date_created: "2026-11-15"

# -------------------------------------------------------------------------------------
# GLOBAL WORKCELL COORDINATE FRAME
# -------------------------------------------------------------------------------------
workspace:
  dimensions_mm:
    width_x: 350.0
    depth_y: 600.0
    board_thickness_mm: 18.0
  origin: "Front-Left baseboard corner (Row 11, Col 0 at Y=0 looking toward +Y)"
  midline_x_mm: 175.0
  picking_arena:
    elevation_z_mm: 0.0            # Flat table / baseboard surface
    retaining_barrier: "8-10mm self-adhesive foam weatherstripping tape"
    silicone_friction_coeff: 0.8
    cube_size_mm: 25.0             # Standard cube width/length
    cube_height_mm: 38.1           # Doubled block thickness (glued craft blocks)
    cube_center_z_mm: 19.05        # Grasp altitude (mm) with vertical clearance
    min_x_mm: 25.0
    max_x_mm: 325.0
    min_y_mm: 25.0
    max_y_mm: 275.0                # Active picking zone across Rows 6..10 (Rows 3..5 excluded)
    excluded_rows: [3, 4, 5]       # Arm clearance zone; no objects placed or dropped
  aruco_markers:
    dict: "DICT_4X4_50"
    marker_size_mm: 50.0
    markers:
      marker_0: {id: 2, col: 0, row: 6, center_world_mm: {x: 25.0, y: 275.0, z: 1.0}}
      marker_1: {id: 0, col: 6, row: 6, center_world_mm: {x: 325.0, y: 275.0, z: 1.0}}
      marker_2: {id: 3, col: 0, row: 11, center_world_mm: {x: 25.0, y: 25.0, z: 1.0}}
      marker_3: {id: 1, col: 6, row: 11, center_world_mm: {x: 325.0, y: 25.0, z: 1.0}}

# -------------------------------------------------------------------------------------
# MANIPULATOR CONFIGURATION (xarm_1)
# -------------------------------------------------------------------------------------
manipulators:
  max_deviation_ticks: 25        # Clamping guardrail against accidental excessive offsets

  xarm_1:
    name: "xArm 1S (Central Manipulator)"
    role: "Picks red and green objects from 7x12 arena and deposits into symmetric Rear Flank containers via overhead rear-flip"
    
    # Mounting position relative to global workspace origin (Rows 3..5, Cols 2..4)
    base_mount_mm:
      x: 175.0
      y: 375.0
      z: 0.0
      z_depth_trim_mm: 0.0         # Dynamic Cartesian tabletop depth offset
      nominal_heading_deg: -90.0   # 502 ticks points directly South (-90° world) down Column 3 midline

    # Serial / USB Interface
    communication:
      preferred_port: "auto"        # Auto-detects USB HID (0483:5750) or Serial
      fallback_serial_device: "/dev/ttyUSB0"
      controller_baud_rate: 9600     # Hiwonder secondary UART runs at 9600 baud
      host_pc_baud_rate: 115200

    # Physical link lengths (millimeters)
    link_lengths_mm:
      base_to_shoulder_d1: 65.0       # Vertical offset to Motor 5 shoulder axis
      upper_arm_L1: 101.0             # Link between shoulder and elbow
      forearm_L2: 95.0                # Link between elbow and wrist pitch
      tool_claw_grip_center_L3: 150.0 # Link from wrist pitch to rubber pad grasp center
      tool_claw_fingertip_L3: 168.0   # Link from wrist pitch to claw outer fingertip
      tool_claw_L4: 150.0             # Backward compatibility alias

    # Dedicated Collection Boxes (Rear Flank Dual Containers, Rows 0..1)
    collection_box:
      id: 1
      name: "Rear Flank Dual Containers (Rows 0..1)"
      grid_layout: "1x2"
      radial_reach_mm: 215.1
      compartments:
        red_box:
          color: "red"
          name: "Red Container Box (Rows 0..1, Cols 0..1)"
          grid_col: 1
          grid_row: 1
          target_world_mm: {x: 50.0, y: 550.0, z: 45.0}
          drop_yaw_tick: 650        # Overhead rear-flip drop yaw (+35.5° from South flipped)
          outer_dimensions_mm: {width_x: 100.0, depth_y: 100.0, height_z: 35.0}
        green_box:
          color: "green"
          name: "Green Container Box (Rows 0..1, Cols 5..6)"
          grid_col: 2
          grid_row: 1
          target_world_mm: {x: 300.0, y: 550.0, z: 45.0}
          drop_yaw_tick: 354        # Overhead rear-flip drop yaw (-35.5° from South flipped)
          outer_dimensions_mm: {width_x: 100.0, depth_y: 100.0, height_z: 35.0}

    # Motor specifications, travel limits & physical inspection testing
    motors:
      motor_1:
        joint_name: "claw_gripper"
        hardware_id: 1
        min_tick: 226
        max_tick: 782
        nominal_center_tick: 517
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0
        motion_description: "Decreasing ticks opens claw (221 raw = 56mm); increasing ticks clamps/closes claw (787 raw = 0mm)"
        test_500_to_450_direction: "Fingers open wider toward 56mm limit"
        claw_span_mm:
          fully_open: {tick: 226, span_mm: 56.0}
          nominal_reset: {tick: 517, span_mm: 43.0}
          grip_cube_25mm: {tick: 630, span_mm: 25.0}
          grip_cube_31mm: {tick: 588, span_mm: 31.75}
          fully_closed_empty: {tick: 782, span_mm: 0.0}

      motor_2:
        joint_name: "wrist_roll"
        hardware_id: 2
        min_tick: 124
        max_tick: 884
        nominal_center_tick: 503
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 503 = level horizontal claw jaws
        motion_description: "Increasing ticks (>503) rolls counter-clockwise (ACW: 889 raw); decreasing ticks (<503) rolls clockwise (CW: 119 raw)"
        test_500_to_450_direction: "Rolls clockwise (CW) toward left finger"

      motor_3:
        joint_name: "wrist_pitch"
        hardware_id: 3
        min_tick: 121
        max_tick: 864
        nominal_center_tick: 504
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 504 = aligned collinearly with forearm
        motion_description: "CW at 869 raw ticks; ACW at 116 raw ticks; decreasing ticks tilts upward/backward"
        test_500_to_450_direction: "Pitches wrist UPWARD away from table"

      motor_4:
        joint_name: "elbow_pitch"
        hardware_id: 4
        min_tick: 153
        max_tick: 860
        nominal_center_tick: 496
        direction_multiplier: 1
        zero_reference_angle_deg: 180.0 # 496 = straight collinear extension with upper arm
        motion_description: "ACW at 865 raw ticks; CW at 148 raw ticks; increasing ticks folds backward"
        test_500_to_450_direction: "Folds forearm forward toward upper arm"

      motor_5:
        joint_name: "shoulder_pitch"
        hardware_id: 5
        min_tick: 125
        max_tick: 854
        nominal_center_tick: 501
        direction_multiplier: 1        # Note: Inverted in URDF pitch, positive in servo ticks
        zero_reference_angle_deg: 90.0  # 501 = 90° upright vertical relative to table
        motion_description: "CW at 859 raw ticks; ACW at 120 raw ticks; decreasing ticks tilts upright/backward"
        test_500_to_450_direction: "Tilts upper arm BACKWARD/upright toward table surface"

      motor_6:
        joint_name: "base_yaw"
        hardware_id: 6
        min_tick: 50
        max_tick: 950
        nominal_center_tick: 502        # 502 ticks = nominal heading (-90° world / South)
        direction_multiplier: 1
        zero_reference_angle_deg: 0.0   # 0° = pointing along nominal heading
        motion_description: "Increasing ticks rotates CCW (toward East); decreasing rotates CW (toward West)"
        test_500_to_450_direction: "Rotates clockwise (CW) toward West"

    # Predefined Multi-State Poses (Calibrated Ticks: [M1, M2, M3, M4, M5, M6])
    poses:
      home_tucked:
        ticks: [517, 503, 504, 496, 501, 502]
        description: "Straight upright vertical reset pose; all servos at physical reset center"
        transit_time_ms: 1500
      ready_standoff:
        ticks: [226, 503, 746, 155, 529, 502]
        description: "Hovering safely above arena picking zone awaiting commands (Zw ≈ 165mm)"
        transit_time_ms: 1600
      rear_transit_tuck:
        ticks: [610, 503, 350, 496, 450, 502]
        description: "High upright clearance pose while flipping from front arena to rear containers"
        transit_time_ms: 1200
      drop_container_red:
        ticks: [226, 503, 149, 629, 347, 650]
        description: "Overhead rear-flip: Red container box (X=50mm, Y=550mm, Z=45mm, yaw tick 650)"
        transit_time_ms: 1600
      drop_container_green:
        ticks: [226, 503, 149, 629, 347, 354]
        description: "Overhead rear-flip: Green container box (X=300mm, Y=550mm, Z=45mm, yaw tick 354)"
        transit_time_ms: 1600
      drop_container:
        ticks: [226, 503, 149, 629, 347, 650]
        description: "Default rear drop container pose (Red box)"
        transit_time_ms: 1600
